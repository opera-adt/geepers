[build-system]
requires = ["setuptools>=64.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "geepers"
authors = [
  { name = "Scott Staniewicz", email = "scott.j.staniewicz@jpl.nasa.gov" },
]
description = "Download GPS data and compare to InSAR"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"

classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
license = { file = "LICENSE" }

# Core: what the operational DISP-CAL image installs (GNSS retrieval in
# `gps_sources`, see docs/dependency_audit.md). Everything heavier is an extra.
dependencies = [
  "numpy",
  "pandas",
  "pyproj",
  "requests",
  "scipy",
  "tqdm",
  "tyro>=0.9.24",
]


# The version will be written into a version.py upon install, auto-generated
# see section: setuptools_scm
# https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html#dynamic-metadata
# dependencies will be read from text files
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/opera-adt/geepers"
"Bug Tracker" = "https://github.com/opera-adt/geepers/issues"
Discussions = "https://github.com/opera-adt/geepers/discussions"
Changelog = "https://github.com/opera-adt/geepers/releases"

[project.optional-dependencies]
# GPS Imaging re-interpolation, Euler-pole plate motion, surfaces/masks
grid = ["shapely>=2"]
# InSAR comparison, MIDAS, strain, validation, zarr/dask workflows, schemas
analysis = [
  "geopandas",
  "pyogrio",
  "xarray",
  "dask>=2025",
  "rasterio",
  "rioxarray",
  "zarr",
  "pandera",
  "lxml",
  "shapely>=2",
]
plot = ["matplotlib>=3.8", "contextily"]
all = ["geepers[grid,analysis,plot]"]
test = [
  "pre-commit",
  "pytest",
  "pytest-cov",
  "pytest-randomly",
  "pytest-recording>=0.13.2",
  "pytest-xdist",
  "ruff",
  "matplotlib>=3.8",
]

# Entry points for the command line interface
[project.scripts]
geepers = "geepers.cli:cli"


[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
geepers = { path = ".", editable = true }

# Core conda packages (mirrors [project.dependencies]); extras are features.
[tool.pixi.dependencies]
python = ">=3.11"
pip = ">=21.3"
git = "*"
numpy = "*"
pandas = "*"
pyproj = "*"
requests = ">=2.32.4"
scipy = "*"
tqdm = ">=4.67.1"
tyro = ">=0.9.24,<0.10"

[tool.pixi.feature.grid.dependencies]
shapely = "*"

[tool.pixi.feature.analysis.dependencies]
geopandas-base = "*"
pyogrio = "*"
xarray = "*"
dask = ">=2025.5.1"
rasterio = "*"
rioxarray = ">=0.19.0"
zarr = "*"
pandera = "*"
lxml = "*"
shapely = "*"

[tool.pixi.tasks]
# Shared task names (00_tools/standards/pixi-tasks.toml): test, lint, docs, golden, e2e
check = "pre-commit run -a"
lint = "pre-commit run -a"
test = "pytest"
docs = "mkdocs serve"
golden = "echo 'no golden dataset in this repo'"
e2e = "echo 'no e2e validation in this repo'"


# pixi install -e test
[tool.pixi.feature.test.dependencies]
pre-commit = "*"
pytest = "*"
pytest-cov = "*"
pytest-randomly = "*"
pytest-recording = ">=0.13.2"
pytest-xdist = "*"
ruff = "*"
matplotlib = ">=3.10.3"
ipython = ">=9.3.0"
lxml = "*"
ipdb = "*"
contextily = "*"

[tool.pixi.feature.docs.dependencies]
mkdocs = "*"
mkdocs-gen-files = "*"
mkdocs-jupyter = "*"
mkdocs-literate-nav = "*"
mkdocs-material = "*"
pymdown-extensions = "*"
matplotlib = ">=3.10.3"
ipython = ">=9.3.0"
lxml = "*"
contextily = ">=1.6.2,<2"

# pixi install -e docs
[tool.pixi.feature.docs.pypi-dependencies]
mkdocstrings = { extras = ["python"] }
mkdocs-section-index = "*"


[tool.pixi.environments]
# `default` keeps the historical behaviour (everything but plotting/docs).
default = { features = ["grid", "analysis"], solve-group = "default" }
test = { features = ["grid", "analysis", "test"], solve-group = "default" }
docs = { features = ["grid", "analysis", "docs"], solve-group = "default" }
# Shared environment names: `dev` for development, `ops` = the core only
# (what the operational DISP-CAL image installs), `core-test` = core + test
# tooling for the import-isolation checks.
dev = { features = ["grid", "analysis", "test", "docs"], solve-group = "default" }
ops = { features = [], solve-group = "ops" }
core-test = { features = ["test"], solve-group = "ops" }


[tool.setuptools_scm]
# https://github.com/pypa/setuptools_scm#configuration-parameters
write_to = "src/geepers/_version.py"
# https://github.com/pypa/setuptools_scm#version-number-construction
version_scheme = "no-guess-dev" # Will not guess the next version

[tool.ruff]
src = ["src"]
unsafe-fixes = true
# Rendered documentation notebooks use pedagogical inline style (compact
# plotting, mid-notebook imports); force-exclude so pre-commit skips them too.
extend-exclude = ["docs/notebooks"]
force-exclude = true

[tool.ruff.lint]
select = [
  "A",      # flake8-builtins
  "ARG",    # flake8-unused-arguments
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "E",      # pycodestyle (errors)
  "W",      # pycodestyle (warnings)
  "EM",     # flake8-errmsg
  "EXE",    # flake8-executable
  "F",      # Pyflakes
  "I",      # isort
  "ISC",    # flake8-implicit-str-concat
  "N",      # pep8-naming
  "NPY201", # numpy 2.0 depgrcations
  "PGH",    # pygrep-hooks
  "PIE",    # flake8-pie
  "PL",     # Pylint
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-use-pathlib
  "PYI",    # flake8-pyi
  "RUF",    # Ruff-specific rules
  "SIM",    # flake8-simplify
  "TRY",    # tryceratops
  "UP",     # pyupgrade  <- not working with Pydantic lower python versions
  "YTT",    # flake8-2020
]

ignore = [
  "PTH123", # `open()` should be replaced by `Path.open()`
  "PLR",    # Pylint Refactor
  "D100",   # Missing docstring in public module
  "D104",   # Missing docstring in public package
  "D105",   # Missing docstring in magic method
  "D102",   # D102: Missing docstring in public method (TODO: remove this ignore)
  "D213",   # D213: Multi-line docstring summary should start at the second line
  "D203",   # 1 blank line required before class docstring
  "N806",   # Variable _ in function should be lowercase
  "SIM108", # Use ternary operator
  "PLC0415", # `import` inside functions: the optional-dependency seams (see _optional.py)
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
"tests/**" = ["D", "N", "PTH", "ARG001", "PLR2004", "E501"]
"scripts/*" = ["F401"]
"src/geepers/uncertainty.py" = ["RUF002"]                   # let us use sigma here
"src/geepers/schemas.py" = ["D106"]
"src/geepers/collocation.py" = ["N803"]                     # covariance matrices C, Css, ...
"src/geepers/trend.py" = ["N803"]                           # design matrix A, covariance C

[tool.black]
target-version = ["py311", "py312", "py313"]
preview = true

[tool.mypy]
# 3.12: numpy >= 2.3 stubs use PEP 695 `type` statements, which mypy rejects
# when targeting 3.11. Runtime support is still >= 3.11.
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pandera.mypy"]


[tool.pytest.ini_options]
doctest_optionflags = "NORMALIZE_WHITESPACE NUMBER"
addopts = "  --cov=geepers  --doctest-modules --randomly-seed=1234 --ignore=scripts --ignore=docs --ignore=data"
filterwarnings = [
  "error",
  # https://github.com/dateutil/dateutil/pull/1285 will be released, but not yet
  "ignore:datetime.datetime.utcfromtimestamp.*:DeprecationWarning",
  "ignore:.*shapely.geos.*:DeprecationWarning",
  # Ignore deprecation warnings from gps module during testing of deprecated functionality
  "ignore:The 'geepers.gps' module is deprecated.*:DeprecationWarning",
  # pyproj 3.7 warns on size-1 coordinate arrays (single-point Geod/Transformer
  # calls); scoped to pyproj so it can't mask array-to-scalar bugs in our code.
  "ignore:Conversion of an array with ndim > 0 to a scalar:DeprecationWarning:pyproj.*",
  # rasterio <= 1.5.1 composes transforms with `*` (e.g. `from_bounds`), which
  # affine 3 deprecates in favour of `@`; same ignore as Venti
  "ignore:Use `@` matmul instead of `\\*` mul operator.*:PendingDeprecationWarning",
]
