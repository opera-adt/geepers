name: Pytest, build docker image, push to GHCR

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # https://github.com/pytest-dev/pytest/issues/2042#issuecomment-429289164
  PY_IGNORE_IMPORTMISMATCH: 1

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  core-only:
    # The operational DISP-CAL image installs geepers with no extras: the
    # GNSS-retrieval core must import and work with the core dependencies only.
    name: Core only (no extras)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install core + test tooling only
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
          python - <<'PY'
          import importlib.util, sys
          heavy = ["dask", "zarr", "pandera", "rasterio", "geopandas", "xarray"]
          present = [m for m in heavy if importlib.util.find_spec(m)]
          assert not present, f"core install pulled in {present}"
          PY
      - name: Import the core
        run: python -c "import geepers; from geepers.gps_sources import UnrGridSource, UnrSource, SideshowSource; print(geepers.__version__)"
      - name: Core tests
        run: pytest -o addopts="" -p no:cacheprovider --record-mode none tests/test_core_imports.py tests/gps_sources

  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        env: [test, core-test]
        # One pixi environment per dependency tier (see pyproject
        # [tool.pixi.environments]): the full set, and the extras-free core
        # with its test subset. `core-only` above covers the pip route.
        include:
          - env: test
            tests: ""
          - env: core-test
            tests: tests/test_core_imports.py tests/test_plate_table.py tests/gps_sources
    name: ${{ matrix.os }} / ${{ matrix.env }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.48.2
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      - name: Install environment
        run: pixi install -e ${{ matrix.env }}

      - name: Test
        run: |
          pixi run -e ${{ matrix.env }} pytest --record-mode none --cov-report=xml ${{ matrix.tests }}

      - name: Upload coverage
        uses: actions/upload-artifact@v5
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.env }}
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Build docker image, push to GHCR
    needs: [pytest]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # setuptools_scm needs the full history to compute the version
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main/tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            docker buildx build --load -t geepers:smoke .
            IMAGE=geepers:smoke
          fi
          docker run --rm "$IMAGE" --help
